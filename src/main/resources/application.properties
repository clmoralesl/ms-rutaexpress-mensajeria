server.port=${SERVER_PORT:8087}
spring.application.name=ms-rutaexpress-mensajeria
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
rutaexpress.mensajeria.admin-url=${RABBITMQ_ADMIN_URL:http://localhost:15672}
rutaexpress.secreto.interno=${RUTAEXPRESS_SECRETO_INTERNO:}
management.endpoints.web.exposure.include=health
